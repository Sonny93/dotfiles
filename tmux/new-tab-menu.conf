# "Nouvel onglet" menu, the single definition behind Alt+n, prefix + c and the command palette.
# Loaded with `source-file`; the formats resolve against the pane that opened the menu.
display-menu -T "Nouvel onglet" \
    "Claude + shells" w { run-shell "~/dotfiles/tmux/workspace.sh #{q:pane_current_path} #{q:session_name}" } \
    "Claude seul" c { new-window -c "#{pane_current_path}" "claude; exec zsh" } \
    "Shell seul" s { new-window -c "#{pane_current_path}" }

# "Nouvel onglet" menu, the single definition behind Alt+n, prefix + c and the command palette.
# Loaded with `source-file`; the formats resolve against the pane that opened the menu. Each entry is a layout of workspace.sh.
display-menu -T "Nouvel onglet" \
    "Claude + shells" w { run-shell "~/dotfiles/tmux/workspace.sh claude-shells #{q:pane_current_path} #{q:session_name}" } \
    "Claude seul" c { run-shell "~/dotfiles/tmux/workspace.sh claude #{q:pane_current_path} #{q:session_name}" } \
    "Shell seul" s { run-shell "~/dotfiles/tmux/workspace.sh shell #{q:pane_current_path} #{q:session_name}" }

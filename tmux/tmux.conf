# Custom tmux settings only: anything absent here falls back to tmux's defaults.

# Claude Code uses Ctrl+B to background a running command, so the prefix moves to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse scrolling and pane selection (hold Shift for native text selection in the terminal)
set -g mouse on

# Esc must be instant in Claude Code and vim
set -s escape-time 10

set -g history-limit 50000

# Let applications react to terminal focus changes
set -g focus-events on

# True colour and modified keys (Shift+Enter in Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Numbering starts at 1, matching the keyboard row
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Forward the pane title (set by zsh: machine badge, host, location) to the Tabby tab
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Splits open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Alt + n and prefix + c open the "Nouvel onglet" menu (Claude + shells, Claude, shell), defined once in new-tab-menu.conf.
# The "Claude + shells" layout (Claude left, two shells right) also comes from workspace.sh, which `t` calls too:
# the main pane takes 60% of the width, the shells share the rest
setw -g main-pane-width 60%
bind -n M-n source-file ~/dotfiles/tmux/new-tab-menu.conf
bind c source-file ~/dotfiles/tmux/new-tab-menu.conf

# Prefix + s picks a session or a project in a popup (fzf) and switches to it, creating the session with the "Claude + shells" layout when missing.
# -EE keeps the popup open on failure so the error stays readable. The native tree stays on prefix + w
bind s display-popup -EE -w 60% -h 60% "~/dotfiles/tmux/session-picker.sh"

# Prefix + n opens the notes of the current project (~/notes/<project>.md) in micro, in a popup. Ctrl+S saves, Ctrl+Q closes.
# It replaces tmux's default next-window on n (Alt+1..9 cover window switching)
bind n display-popup -EE -w 80% -h 80% -d "#{pane_current_path}" "~/dotfiles/tmux/notes.sh"

# Prefix + Ctrl+K opens the command palette in a popup (fzf over palette.tsv).
# The script stores the chosen command in @palette_command; it runs here once the popup is closed, so prompts, menus
# and popups can draw on the client, with the original pane, window and session as targets. -EE keeps the popup open on failure
bind C-k display-popup -EE -w 60% -h 60% "~/dotfiles/tmux/command-palette.sh" \; if-shell -F "#{@palette_command}" { run-shell -C "#{@palette_command}" }

# Alt + 1..9 jumps to a window without the prefix (Claude Code only uses Meta+P, O, T, Up and Down)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Prefix + h shows the cheatsheet in a popup (glow, or less when glow is not on PATH)
bind h display-popup -E -w 80% -h 80% "glow -p ~/dotfiles/tmux/cheatsheet.md || less ~/dotfiles/tmux/cheatsheet.md"

# Cobalt2 palette, same as tabby/config.yaml: pane colours 0..15 replace the terminal's ANSI palette inside tmux
# (tmux 3.7 has no option for the cursor colour, so Tabby's #f0cc09 applies)
set -g window-style "fg=#ffffff,bg=#132738"
set -g pane-colours[0] "#000000"
set -g pane-colours[1] "#ff0000"
set -g pane-colours[2] "#38de21"
set -g pane-colours[3] "#ffe50a"
set -g pane-colours[4] "#1460d2"
set -g pane-colours[5] "#ff005d"
set -g pane-colours[6] "#00bbbb"
set -g pane-colours[7] "#bbbbbb"
set -g pane-colours[8] "#555555"
set -g pane-colours[9] "#f40e17"
set -g pane-colours[10] "#3bd01d"
set -g pane-colours[11] "#edc809"
set -g pane-colours[12] "#5555ff"
set -g pane-colours[13] "#ff55ff"
set -g pane-colours[14] "#6ae3fa"
set -g pane-colours[15] "#ffffff"

# Borders stay discreet except around the pane that has the focus
set -g pane-border-style "fg=#2e5b7d"
set -g pane-active-border-style "fg=#ffc600"

# Messages, copy mode selection and popups in the same yellow on dark
set -g message-style "bg=#ffc600 fg=#193549 bold"
set -g message-command-style "bg=#193549 fg=#ffc600"
set -g mode-style "bg=#ffc600 fg=#193549"
set -g popup-style "fg=#ffffff bg=#132738"
set -g popup-border-style "fg=#ffc600"

# Two-line bar at the top: line 1 lists the sessions, line 2 is the usual window list
set -g status-position top
set -g status 2
set -g status-style "bg=#193549 fg=#ffffff"

# Line 1: the session of the client is yellow, another session turns pink when one of its windows rang the bell.
# A click on a session switches to it (range=session, handled by the default MouseDown1Status binding).
# Styles use spaces, a comma would split the #{S:} arguments
set -g status-format[0] "#{S:#[range=session|#{session_id}]#{?session_alerts,#[bg=#ff628c fg=#193549 bold],#[default]} #S #[norange default],#[range=session|#{session_id} bg=#ffc600 fg=#193549 bold] #S #[norange default]}"

# Line 2: tmux's default window line, copied as is to keep clickable tabs, status-left and status-right
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# The session name is already on line 1
set -g status-left ""

# A tab shows the title of the window's first pane (Claude Code writes its task there), so it stays
# stable while the focus is in a shell. The folder of that pane comes first when it is not the session's folder
set -g window-status-format " #I #{P:#{?#{==:#{pane_index},1},#{?#{!=:#{pane_current_path},#{session_path}},#{b:pane_current_path} · ,}#{=/25/…:pane_title},}} "
set -g window-status-current-format "#{E:window-status-format}"
set -g window-status-style "fg=#ffffff bg=#193549"
set -g window-status-current-style "fg=#ffffff bg=#0088ff bold"

# A bell in any pane of another window (Claude Code rings it when it is done or waits for you) turns its tab pink
set -g monitor-bell on
set -g window-status-bell-style "fg=#193549 bg=#ff628c bold"

# Reminder of the essential keys and the time, highlighted while the prefix waits for its key
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[bg=#ff9d00 fg=#193549 bold] ^A … touche ? #[default],} ^A ^K palette · Alt+n onglet · s session · n notes · d détacher · %H:%M "

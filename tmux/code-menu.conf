# "Code" menu, the single definition behind Alt+g and the command palette: read-only views of the work in progress, nothing in it can change the repository.
# Loaded with `source-file`; the formats resolve against the pane that opened the menu, so each popup opens on that pane's directory; when the repository has several worktrees, each view first asks which one (pick-worktree.sh).
# -EE keeps a popup open on failure (not a git repository, tool missing) so the message stays readable.
display-menu -T "Code" \
    "Diff en cours" d { display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" "~/dotfiles/tmux/code-diff.sh" } \
    "Fichiers du repo" f { display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" "~/dotfiles/tmux/code-files.sh" } \
    "Rechercher dans le code" r { display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" "~/dotfiles/tmux/code-search.sh" } \
    "Commits" c { display-popup -EE -w 90% -h 90% -d "#{pane_current_path}" "~/dotfiles/tmux/code-log.sh" }
